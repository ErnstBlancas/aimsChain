[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aims_chain"
version = "0.2.0"
description = "A package for finding minimum energy path and transition state."
readme = "README.md"
requires-python = ">=3.10"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE"]

# List your dependencies here
dependencies = [
    "numpy",
    "scipy"
]

[project.entry-points.console_scripts]
runchain = "aimsChain.tools.runchain:main"

[project.optional-dependencies]
tests = ["pytest", "pytest-cov"]

[project.urls]
repository = "https://gitlab.com/FHI-aims-club/aims-chain"
